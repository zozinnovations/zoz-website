name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test-docker:
    name: Build & Verify Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: zoz-website:test
          load: true
      - name: Validate Caddy configuration in container
        run: docker run --rm zoz-website:test caddy validate --config /etc/caddy/Caddyfile
